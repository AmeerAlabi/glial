# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Lets the team edit website content at https://app.pagescms.org without
# touching code. Every save commits to GitHub and Vercel redeploys the site.

media:
  input: public/uploads
  output: /uploads

content:
  # ---------------------------------------------------------------- Events
  - name: events
    label: Events
    type: file
    path: src/content/events.json
    fields:
      - name: events
        label: Events
        description: Events move to the "Past events" archive automatically once their date has passed.
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - name: slug
            label: URL slug
            type: string
            required: true
            description: Short unique ID, lowercase with dashes, e.g. world-tbi-day-2026
          - name: type
            label: Type
            type: select
            options:
              values: [Webinar, Community outreach, Campaign, Workshop, Conference]
          - name: start
            label: Start
            type: string
            required: true
            description: "Date as YYYY-MM-DD, or date and time as YYYY-MM-DDTHH:MM (e.g. 2026-03-20T11:00)"
          - name: end
            label: End
            type: string
            description: Optional. Same format as Start.
          - name: datePrecision
            label: Show date as
            type: select
            default: day
            options:
              values:
                - { value: day, label: "Full date (21 March 2026)" }
                - { value: month, label: "Month only (March 2026)" }
                - { value: year, label: "Year only (2026)" }
          - { name: timezone, label: Time zone, type: string, default: WAT }
          - name: mode
            label: Format
            type: select
            default: online
            options:
              values:
                - { value: online, label: Online }
                - { value: in-person, label: In person }
          - { name: location, label: Location, type: string, description: "Venue and city, or the platform (e.g. Zoom)" }
          - name: rsvp
            label: Show RSVP form
            type: boolean
            description: Upcoming events only. RSVPs arrive in the team inbox.
          - { name: registrationUrl, label: External registration link, type: string, description: "Optional. Use instead of the RSVP form (e.g. a Zoom or Google Form link)." }
          - { name: joinUrl, label: Join link, type: string, description: Optional public link to join the event }
          - { name: summary, label: Short summary, type: text, required: true }
          - { name: description, label: Description, type: text }
          - { name: speakers, label: Speakers, type: text, description: Comma-separated names and roles }
          - { name: image, label: Image, type: image }

  # ------------------------------------------------- Advocacy & outreach
  - name: outreach
    label: Advocacy & outreach
    type: file
    path: src/content/outreach.json
    fields:
      - name: entries
        label: Outreach entries
        description: Entries are sorted by date automatically, newest first.
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: slug, label: URL slug, type: string, required: true, description: "Short unique ID, lowercase with dashes, e.g. cranioguard-mission-3" }
          - name: category
            label: Type
            type: select
            options:
              values: [Road safety, Community health, Campaign, School outreach, Training, Advocacy]
          - { name: date, label: Date, type: date, required: true }
          - name: datePrecision
            label: Show date as
            type: select
            default: day
            options:
              values:
                - { value: day, label: Full date }
                - { value: month, label: Month only }
                - { value: year, label: Year only }
          - { name: location, label: Location, type: string, required: true }
          - { name: partners, label: In partnership with, type: string }
          - { name: summary, label: Short summary, type: text, required: true }
          - { name: body, label: Full write-up, type: text, description: Leave a blank line between paragraphs. }
          - { name: highlights, label: Key facts, type: string, list: true, description: "Short facts shown as tags, e.g. 80+ riders trained" }
          - name: photos
            label: Photos
            type: object
            list: true
            fields:
              - { name: src, label: Photo, type: image }
              - { name: video, label: Or video link, type: string, description: YouTube link or video file URL }
              - { name: alt, label: Description for screen readers, type: string, required: true, description: "Describe what the photo shows, e.g. Volunteers fitting a helmet on a rider" }
              - { name: caption, label: Caption, type: string }

  # -------------------------------------------------------- Collaborations
  - name: collaborations
    label: Collaborations
    type: file
    path: src/content/collaborations.json
    fields:
      - name: collaborations
        label: Collaborations
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: slug, label: URL slug, type: string, required: true, description: Short unique ID, lowercase with dashes }
          - { name: shortName, label: Abbreviation, type: string }
          - { name: partner, label: Partner organisation, type: string }
          - name: status
            label: Status
            type: select
            default: active
            options:
              values:
                - { value: active, label: Active }
                - { value: coming-soon, label: Coming soon }
          - { name: summary, label: One-line description, type: text, required: true }
          - { name: since, label: Since, type: string, description: "e.g. September 2026" }
          - { name: logo, label: Logo, type: image }
          - { name: body, label: Full write-up or report, type: text, description: Shown when visitors expand the card. Leave a blank line between paragraphs. }
          - name: stats
            label: Key figures
            type: object
            list: true
            fields:
              - { name: value, label: Figure, type: string, description: "e.g. 1,000+" }
              - { name: label, label: Describes, type: string }
          - name: media
            label: Photos and videos
            type: object
            list: true
            fields:
              - { name: src, label: Photo, type: image }
              - { name: video, label: Or video link, type: string, description: YouTube link or video file URL }
              - { name: alt, label: Description for screen readers, type: string }
              - { name: caption, label: Caption, type: string }
          - { name: link, label: Website, type: string }

  # ------------------------------------------------------------------ Team
  - name: team
    label: Team
    type: file
    path: src/content/team.json
    fields:
      - name: members
        label: Members
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role or unit, type: string, required: true }
          - name: group
            label: Section
            type: select
            default: team
            options:
              values:
                - { value: executive, label: Executive team (large photo cards) }
                - { value: leads, label: Department and unit leads (name list) }
                - { value: team, label: Team members (small photo cards) }
          - { name: photo, label: Photo, type: image, description: Square or portrait photo }
          - { name: bio, label: Short bio, type: text, description: Shown for the executive team only }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: x, label: X (Twitter) URL, type: string }

  # ------------------------------------------------------------- Resources
  - name: resources
    label: Resource hub
    type: file
    path: src/content/resources.json
    fields:
      - name: topics
        label: Topics
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: slug, label: URL slug, type: string, required: true }
          - { name: summary, label: Short summary, type: text, required: true }
          - { name: description, label: Description, type: text }
          - name: infographics
            label: Translations
            description: The first language in the list is shown by default.
            type: object
            list: true
            fields:
              - { name: language, label: Language, type: string, required: true }
              - { name: code, label: Language code, type: string, required: true, description: "ISO code, e.g. yo, ha, ig, sw, fr" }
              - { name: file, label: Infographic image, type: image, required: true }

  # ------------------------------------------------------- Site settings
  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    fields:
      - { name: name, label: Organisation name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: phone, label: Phone, type: string, description: Leave empty to hide }
      - { name: location, label: Location, type: string }
      - name: social
        label: Social media
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - { name: x, label: X (Twitter) URL, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
      - name: forms
        label: Forms
        type: object
        fields:
          - { name: formspreeEndpoint, label: Formspree endpoint, type: string }
      - name: newsletter
        label: Newsletter
        type: object
        fields:
          - { name: substackUrl, label: Substack URL, type: string, description: "e.g. https://theglialinitiative.substack.com. Leave empty to collect signups by email instead." }
      - name: donation
        label: Donation details
        type: object
        fields:
          - { name: bankName, label: Bank, type: string }
          - { name: accountName, label: Account name, type: string }
          - { name: accountNumber, label: Account number, type: string }
          - { name: note, label: Note under the details, type: text }
